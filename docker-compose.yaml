# Coolify stack: Obsidian desktop + MCPVault over HTTP on one shared vault volume,
# with mcp-auth-proxy in front of MCPVault for Claude OAuth.
#
# Obsidian UI is bound to the Tailscale IP only. MCPVault publishes no ports;
# assign a Coolify domain to authproxy (port 80) to reach it.
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    restart: unless-stopped
    shm_size: 1gb
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Los_Angeles}
      - CUSTOM_USER=${OBSIDIAN_USER:-kevin}
      - PASSWORD=${OBSIDIAN_PASSWORD:?OBSIDIAN_PASSWORD missing}
    volumes:
      - obsidian-config:/config
      - vault:/vaults
    ports:
      - "${TAILSCALE_IP:-100.83.15.84}:3010:3000"
      - "${TAILSCALE_IP:-100.83.15.84}:3011:3001"

  mcpvault:
    build: .
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault/${VAULT_NAME:-Main}
      - ALLOW_NO_AUTH=true
      - READ_ONLY=${READ_ONLY:-false}
    volumes:
      - vault:/vault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  authproxy:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.2
    restart: unless-stopped
    environment:
      - EXTERNAL_URL=${EXTERNAL_URL:?EXTERNAL_URL missing}
      - NO_AUTO_TLS=true
      - PASSWORD=${PROXY_PASSWORD:?PROXY_PASSWORD missing}
    command: http://mcpvault:3333/mcp
    volumes:
      - authproxy-data:/data
    depends_on:
      - mcpvault

volumes:
  obsidian-config:
  vault:
  authproxy-data:
