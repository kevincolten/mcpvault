# Coolify stack: MCPVault over HTTP plus Obsidian Headless Sync, sharing one vault volume.
#
# Nothing here is public. MCPVault joins the shared `coolify` network as
# `obsidian-mcpvault` so the austindevs-mcp gateway can reach it at
# http://obsidian-mcpvault:3333/mcp
#
# No bearer token: the endpoint is not published and only the gateway talks to
# it. To turn auth back on, drop ALLOW_NO_AUTH and set MCP_AUTH_TOKEN as a
# runtime env var in Coolify. The auth code in http.ts is still there.
# The sync sidecar pushes vault changes to Obsidian Sync and pulls edits back.
services:
  mcpvault:
    build: .
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault/${VAULT_NAME:-Main}
      - ALLOW_NO_AUTH=true
      - READ_ONLY=${READ_ONLY:-false}
    volumes:
      - vault:/vault
    networks:
      default:
      coolify:
        aliases:
          - obsidian-mcpvault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  sync:
    build:
      context: .
      dockerfile: sync.Dockerfile
    environment:
      - VAULT_PATH=/vault/${VAULT_NAME:-Main}
    restart: unless-stopped
    volumes:
      - vault:/vault
      - sync-home:/home/node
    depends_on:
      - mcpvault

volumes:
  vault:
  sync-home:

networks:
  coolify:
    external: true
