# Coolify stack: Obsidian desktop + MCPVault over HTTP on one shared vault volume.
#
# Nothing here is public. Obsidian UI is bound to the Tailscale IP only.
# MCPVault joins the shared `coolify` network as `obsidian-mcpvault` so the
# austindevs-mcp gateway can reach it at http://obsidian-mcpvault:3333/mcp
# with a bearer token (MCP_AUTH_TOKEN).
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    restart: unless-stopped
    shm_size: 1gb
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Los_Angeles}
      - CUSTOM_USER=${OBSIDIAN_USER:-kevin}
      - PASSWORD=${OBSIDIAN_PASSWORD:?OBSIDIAN_PASSWORD missing}
    volumes:
      - obsidian-config:/config
      - vault:/vaults
    ports:
      - "${TAILSCALE_IP:-100.83.15.84}:3010:3000"
      - "${TAILSCALE_IP:-100.83.15.84}:3011:3001"

  mcpvault:
    build: .
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault/${VAULT_NAME:-Main}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN missing}
      - READ_ONLY=${READ_ONLY:-false}
    volumes:
      - vault:/vault
    networks:
      default:
      coolify:
        aliases:
          - obsidian-mcpvault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  obsidian-config:
  vault:

networks:
  coolify:
    external: true
