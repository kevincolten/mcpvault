# Coolify stack: MCPVault over HTTP plus Obsidian Headless Sync, sharing one vault volume.
#
# Nothing here is public. MCPVault joins the shared `coolify` network as
# `obsidian-mcpvault` so the austindevs-mcp gateway can reach it at
# http://obsidian-mcpvault:3333/mcp with a bearer token (MCP_AUTH_TOKEN).
# The sync sidecar pushes vault changes to Obsidian Sync and pulls edits back.
#
# MCP_AUTH_TOKEN is set as runtime env in Coolify. It is not marked required here
# because Coolify interpolates the file at build time without runtime values.
# mcpvault exits on startup if it is empty.
services:
  mcpvault:
    build: .
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault/${VAULT_NAME:-Main}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - READ_ONLY=${READ_ONLY:-false}
    volumes:
      - vault:/vault
    networks:
      default:
      coolify:
        aliases:
          - obsidian-mcpvault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  sync:
    build:
      context: .
      dockerfile: sync.Dockerfile
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault/${VAULT_NAME:-Main}
    volumes:
      - vault:/vault
      - sync-home:/home/node
    depends_on:
      - mcpvault

volumes:
  vault:
  sync-home:

networks:
  coolify:
    external: true
