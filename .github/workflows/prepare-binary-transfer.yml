name: Prepare binary transfer build
on:
  push:
    branches: [feat/binary-file-transfer]
    paths:
      - 'src/**'
      - '.github/workflows/prepare-binary-transfer.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/binary-file-transfer
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Commit compiled distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build binary file transfer distribution"
            git push origin HEAD:feat/binary-file-transfer
          fi
